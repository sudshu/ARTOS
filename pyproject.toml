[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artos-research-orchestrator"
version = "0.1.0"
description = "Local-first, auditable research orchestration with independent agent review"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
report = ["python-pptx>=0.6.23"]
test = ["pytest>=7"]

[project.scripts]
artos = "artos.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/sudshu/ARTOS"
